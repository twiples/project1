<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helen's "What's the problem" site</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --deep-navy: #0a1628;
            --rich-burgundy: #8b1538;
            --warm-gold: #d4af37;
            --soft-cream: #f8f5f0;
            --slate-gray: #4a5568;
            --light-blue: #e8f2f7;
        }
        
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: linear-gradient(135deg, var(--deep-navy) 0%, #1a2845 100%);
            color: var(--soft-cream);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Decorative background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 15s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            50% { transform: scale(1.1) translate(-5%, 5%); opacity: 0.5; }
        }
        
        header {
            padding: 3rem 2rem 2rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--warm-gold), #f4d03f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            animation: fadeInDown 0.8s ease-out;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--light-blue);
            font-weight: 500;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.3s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .search-container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease-out 0.5s backwards;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 1.2rem 3.5rem 1.2rem 1.5rem;
            font-size: 1.1rem;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            color: var(--soft-cream);
            font-family: 'IBM Plex Sans', sans-serif;
            transition: all 0.3s ease;
        }
        
        .search-input::placeholder {
            color: rgba(248, 245, 240, 0.5);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--warm-gold);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
        }
        
        .search-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--warm-gold);
            font-size: 1.3rem;
        }
        
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            animation: fadeIn 0.8s ease-out 0.7s backwards;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--warm-gold);
            display: block;
            line-height: 1;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: var(--light-blue);
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .map-container {
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            padding: 3rem;
            margin-bottom: 3rem;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out 0.9s backwards;
        }
        
        .map-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: var(--warm-gold);
        }
        
        #us-map {
            width: 100%;
            max-width: 900px;
            height: 600px;
            margin: 0 auto;
            display: block;
        }
        
        .state {
            fill: rgba(212, 175, 55, 0.15);
            stroke: var(--warm-gold);
            stroke-width: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .state:hover {
            fill: rgba(212, 175, 55, 0.4);
            stroke-width: 2;
        }
        
        .state.has-measures {
            fill: rgba(139, 21, 56, 0.6);
        }
        
        .state.has-measures:hover {
            fill: rgba(139, 21, 56, 0.8);
        }
        
        .state-label {
            fill: var(--soft-cream);
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            text-anchor: middle;
        }
        
        .details-panel {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 2.5rem;
            margin-top: 2rem;
            backdrop-filter: blur(10px);
            display: none;
        }
        
        .details-panel.active {
            display: block;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .state-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
        }
        
        .state-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--warm-gold);
            font-weight: 700;
        }
        
        .state-summary {
            text-align: right;
        }
        
        .summary-item {
            font-size: 0.95rem;
            margin: 0.3rem 0;
            color: var(--light-blue);
        }
        
        .summary-number {
            font-weight: 700;
            color: var(--warm-gold);
        }
        
        .measures-list {
            margin-top: 2rem;
        }
        
        .measure-card {
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .measure-card:hover {
            transform: translateX(8px);
            border-color: var(--warm-gold);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
        }
        
        .measure-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .measure-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--warm-gold);
            margin-bottom: 0.3rem;
        }
        
        .measure-id {
            font-size: 0.9rem;
            color: var(--light-blue);
            opacity: 0.8;
        }
        
        .result-badge {
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .result-approved {
            background: rgba(76, 175, 80, 0.3);
            color: #81c784;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }
        
        .result-rejected {
            background: rgba(244, 67, 54, 0.3);
            color: #e57373;
            border: 1px solid rgba(244, 67, 54, 0.5);
        }
        
        .arguments-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .argument-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 1.5rem;
        }
        
        .argument-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }
        
        .pro-label {
            color: #81c784;
        }
        
        .con-label {
            color: #e57373;
        }
        
        .argument-text {
            color: var(--soft-cream);
            line-height: 1.6;
            font-size: 0.95rem;
        }
        
        .source-tag {
            display: inline-block;
            background: rgba(212, 175, 55, 0.2);
            color: var(--warm-gold);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 1rem;
        }
        
        .close-btn {

            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: var(--rich-burgundy);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(139, 21, 56, 0.3);
        }

            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .arguments-section {

            }

            }

                font-size: 2rem;
            }

            .map-container {
                padding: 1.5rem;
            }

            #us-map {

            }
        }

        /* Password Protection Overlay */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--deep-navy) 0%, #1a2845 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .password-overlay.hidden {
            display: none;
        }

        .password-box {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 3rem;
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: fadeInDown 0.8s ease-out;
        }

        .password-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--warm-gold);
            margin-bottom: 1rem;
        }

        .password-subtitle {
            color: var(--light-blue);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .password-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--soft-cream);
            font-family: 'IBM Plex Sans', sans-serif;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 1rem;

            outline: none;
            border-color: var(--warm-gold);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
        }

            width: 100%;
            background: rgba(139, 21, 56, 0.8);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'IBM Plex Sans', sans-serif;
        }

        .password-submit:hover {
            background: var(--rich-burgundy);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(139, 21, 56, 0.3);
        }

        .password-error {
            color: #e57373;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .password-error.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .main-container {
            display: none;
        }

        .main-container.unlocked {
            display: block;
        }
    </style>
</head>
<body>

    <div id="passwordOverlay" class="password-overlay">

            <p class="password-subtitle">Please enter the password to continue</p>
            <input
                type="password"

                class="password-input"
                placeholder="Enter password"
                autocomplete="off"
            >
            <button id="passwordSubmit" class="password-submit">Enter</button>
            <div id="passwordError" class="password-error">Incorrect password. Please try again.</div>
        </div>
    </div>

    </header>

    <script>
        // Password Protection
        const CORRECT_PASSWORD = "ballot2024"; // Change this to your desired password

        function checkPassword() {
            const passwordInput = document.getElementById('passwordInput');
            const passwordError = document.getElementById('passwordError');
            const passwordOverlay = document.getElementById('passwordOverlay');
            const mainContainer = document.getElementById('mainContainer');
            const enteredPassword = passwordInput.value;

            if (enteredPassword === CORRECT_PASSWORD) {
                passwordOverlay.classList.add('hidden');
                mainContainer.classList.add('unlocked');
                sessionStorage.setItem('authenticated', 'true');
                passwordError.classList.remove('show');
            } else {
                passwordError.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // Check if already authenticated in this session
        if (sessionStorage.getItem('authenticated') === 'true') {
            document.getElementById('passwordOverlay').classList.add('hidden');
            document.getElementById('mainContainer').classList.add('unlocked');
        }

        // Event listeners for password
        document.getElementById('passwordSubmit').addEventListener('click', checkPassword);
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Focus password input on load
        window.addEventListener('load', () => {
            if (sessionStorage.getItem('authenticated') !== 'true') {
                document.getElementById('passwordInput').focus();
            }
        });

    </script>

        Object.entries(statePositions).forEach(([stateKey, pos]) => {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', pos.x);
            circle.setAttribute('cy', pos.y);
            circle.setAttribute('r', '40');
            circle.setAttribute('class', 'state has-measures');
            circle.setAttribute('data-state', stateKey);
            circle.addEventListener('click', () => showStateDetails(stateKey));
            svg.appendChild(circle);
            
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', pos.x);
            text.setAttribute('y', pos.y + 5);
            text.setAttribute('class', 'state-label');
            text.textContent = pos.abbr;
            svg.appendChild(text);
        });
        
        function showStateDetails(stateKey) {
            const state = ballotData[stateKey];
            const panel = document.getElementById('detailsPanel');
            const searchResults = document.getElementById('searchResults');
            searchResults.classList.remove('active');
            
            let html = `
                <div class="state-header">
                    <h2 class="state-name">${state.name}</h2>
                    <div class="state-summary">
                        <div class="summary-item">Total Measures: <span class="summary-number">${state.total}</span></div>
                        <div class="summary-item">Approved: <span class="summary-number">${state.approved}</span></div>
                        <div class="summary-item">Rejected: <span class="summary-number">${state.rejected}</span></div>
                    </div>
                </div>
                <div class="measures-list">
            `;
            
            state.measures.forEach(measure => {
                html += `
                    <div class="measure-card">
                        <div class="measure-id" style="color: var(--light-blue); font-size: 0.85rem; margin-bottom: 0.3rem; opacity: 0.9;">📍 ${measure.jurisdiction || 'Statewide'}</div>
                        <div class="measure-header">
                            <div>
                                <div class="measure-title">${measure.title}</div>
                                <div class="measure-id">${measure.id}</div>
                            </div>
                            <div class="result-badge result-${measure.result}">${measure.resultText}</div>
                        </div>
                        <div class="arguments-section">
                            <div class="argument-box">
                                <div class="argument-label pro-label">✓ Pro Arguments</div>
                                <div class="argument-text">${measure.pros}</div>
                            </div>
                            <div class="argument-box">
                                <div class="argument-label con-label">✗ Con Arguments</div>
                                <div class="argument-text">${measure.cons}</div>
                            </div>
                        </div>
                        <div class="source-tag">Source: ${measure.source}</div>
                    </div>
                `;
            });
            
            html += `
                </div>
                <button class="close-btn" onclick="closeDetails()">Close</button>
            `;
            
            panel.innerHTML = html;
            panel.classList.add('active');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function closeDetails() {
            document.getElementById('detailsPanel').classList.remove('active');
            document.getElementById('searchResults').classList.remove('active');
        }
        
        // Search functionality
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            if (query.length < 2) {
                document.getElementById('searchResults').classList.remove('active');
                return;
            }
            
            const results = [];
            
            Object.entries(ballotData).forEach(([stateKey, state]) => {
                state.measures.forEach(measure => {
                    const searchText = `${measure.title} ${measure.pros} ${measure.cons}`.toLowerCase();
                    if (searchText.includes(query)) {
                        results.push({
                            state: state.name,
                            stateKey: stateKey,
                            measure: measure
                        });
                    }
                });
            });
            
            displaySearchResults(results, query);
        });
        
        function displaySearchResults(results, query) {
            const panel = document.getElementById('searchResults');
            const detailsPanel = document.getElementById('detailsPanel');
            detailsPanel.classList.remove('active');
            
            if (results.length === 0) {
                panel.innerHTML = `
                    <div class="no-results">
                        No ballot measures found matching "${query}"
                    </div>
                    <button class="close-btn" onclick="closeDetails()">Close</button>
                `;
                panel.classList.add('active');
                return;
            }
            
            let html = `
                <div class="state-header">
                    <h2 class="state-name">Search Results</h2>
                    <div class="state-summary">
                        <div class="summary-item">Found: <span class="summary-number">${results.length}</span> measures</div>
                    </div>
                </div>
                <div class="measures-list">
            `;
            
            results.forEach(result => {
                html += `
                    <div class="measure-card">
                        <div class="measure-id" style="color: var(--warm-gold); font-size: 1rem; margin-bottom: 0.5rem;">${result.state}</div>
                        <div class="measure-id" style="color: var(--light-blue); font-size: 0.85rem; margin-bottom: 0.5rem; opacity: 0.9;">📍 ${result.measure.jurisdiction || 'Statewide'}</div>
                        <div class="measure-header">
                            <div>
                                <div class="measure-title">${result.measure.title}</div>
                                <div class="measure-id">${result.measure.id}</div>
                            </div>
                            <div class="result-badge result-${result.measure.result}">${result.measure.resultText}</div>
                        </div>
                        <div class="arguments-section">
                            <div class="argument-box">
                                <div class="argument-label pro-label">✓ Pro Arguments</div>
                                <div class="argument-text">${result.measure.pros}</div>
                            </div>
                            <div class="argument-box">
                                <div class="argument-label con-label">✗ Con Arguments</div>
                                <div class="argument-text">${result.measure.cons}</div>
                            </div>
                        </div>
                        <div class="source-tag">Source: ${result.measure.source}</div>
                    </div>
                `;
            });
            
            html += `
                </div>
                <button class="close-btn" onclick="closeDetails()">Close Search</button>
            `;
            
            panel.innerHTML = html;
            panel.classList.add('active');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
